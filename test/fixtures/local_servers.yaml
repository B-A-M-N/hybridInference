# Local SGLang/vLLM Server Configuration for Direct Testing (Phase A)
#
# This configuration file defines local model servers to test directly,
# without going through the hybridInference gateway.
#
# Usage:
#   1. Default: pytest test/external/test_local_sglang.py
#   2. Custom config: SGLANG_TEST_CONFIG=my_config.yaml pytest ...
#   3. Quick URLs: SGLANG_TEST_URLS="http://localhost:8001,http://localhost:8002" pytest ...

servers:
  # ========== Primary Local Server ==========
  - name: "llama-3.2-3b-local"
    url: "http://localhost:8001"
    enabled: true
    timeout: 30

    # Expected model ID returned by /v1/models
    # Leave empty to skip validation
    expected_model_id: "/n/netscratch/juncheng_lab/yiyuliu/llm_models/Llama-3.2-3B"

    # Test prompts (optional, will use defaults if not specified)
    test_prompts:
      simple: "Say 'Hello, World!' and nothing else."
      streaming: "Count from 1 to 5."

    # Request parameters
    max_tokens: 64
    temperature: 0.1

  # ========== Additional Servers (disabled by default) ==========

  # Example: Second local server on different port
  - name: "qwen-2.5-7b-local"
    url: "http://localhost:8002"
    enabled: false  # Set to true when this server is running
    timeout: 30
    expected_model_id: "/models/Qwen2.5-7B-Instruct"
    max_tokens: 64
    temperature: 0.1

  # Example: Third server on different GPU node
  - name: "mistral-7b-gpu-node2"
    url: "http://gpu-node2:8001"
    enabled: false
    timeout: 30
    expected_model_id: "/models/Mistral-7B-Instruct-v0.3"
    max_tokens: 64
    temperature: 0.1

# ========== Default Configuration ==========
# These values are used when not specified in individual server configs
defaults:
  timeout: 30
  max_tokens: 64
  temperature: 0.1
  test_prompts:
    simple: "Say 'Hello, World!' and nothing else."
    streaming: "Count from 1 to 5."
