models:
  - id: test-model-1
    name: Test Model 1
    provider: vllm
    base_url: ${LOCAL_BASE_URL}
    context_length: 8192
    max_output_length: 4096
    supports_tools: false
    supports_structured_output: false
    supported_params: [temperature, top_p, max_tokens]
    aliases: ["test-alias-1"]
    route:
      - kind: vllm
        weight: 1.0
        base_url: ${LOCAL_BASE_URL}

  - id: test-model-2
    name: Test Model 2
    provider: llama
    base_url: http://remote.test
    api_key: test-key
    context_length: 16384
    max_output_length: 8192
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, top_k, max_tokens, stop, seed]
    aliases: ["test-alias-2"]
    route:
      - kind: llama
        weight: 1.0
        base_url: http://remote.test
        api_key: test-key
