# 3-tool fixture derived from Codex-style agents (9,983 production requests).
tools:
  - type: function
    function:
      name: execute_shell
      description: Execute a shell command and return stdout/stderr.
      parameters:
        type: object
        properties:
          command:
            type: string
            description: The shell command to execute.
        required:
          - command

  - type: function
    function:
      name: read_file
      description: Read the contents of a file at the given path.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Absolute or relative path to the file.
        required:
          - path

  - type: function
    function:
      name: write_file
      description: Write content to a file, creating or overwriting it.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Absolute or relative path to the file.
          content:
            type: string
            description: The content to write.
        required:
          - path
          - content
