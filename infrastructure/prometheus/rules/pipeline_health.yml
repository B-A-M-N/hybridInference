groups:
  - name: pipeline-health
    interval: 30s
    rules:
      # Removed unimplemented alerts:
      # - ExportLagHigh (depends on export_lag_seconds - not implemented)
      # - WALBacklogGrowing (depends on wal_backlog_bytes - not implemented)
      # - HighCostRate (depends on api_cost_cents_total - not implemented)
      # These can be added back when the corresponding metrics are implemented.

      - alert: ProviderAvailabilityLow
        expr: provider_availability < 0.90
        for: 10m
        labels:
          severity: watch
        annotations:
          summary: "Provider {{ $labels.provider }} availability < 90%"
          description: "Provider {{ $labels.provider }} reports sustained availability degradation (current: {{ $value | humanizePercentage }})."
