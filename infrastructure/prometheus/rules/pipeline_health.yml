groups:
  - name: pipeline-health
    interval: 30s
    rules:
      - alert: ExportLagHigh
        expr: export_lag_seconds > 900
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Export lag > 15m"
          description: "Request tracking export is lagging over 15 minutes."

      - alert: WALBacklogGrowing
        expr: wal_backlog_bytes > 50000000
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "WAL backlog > 50MB"
          description: "Local WAL backlog exceeds threshold; investigate export worker."

      - alert: ProviderAvailabilityLow
        expr: provider_availability < 0.90
        for: 10m
        labels:
          severity: watch
        annotations:
          summary: "Provider availability < 90%"
          description: "Provider reports sustained availability degradation."

      # Cost rate alert (example threshold; tune per environment)
      - alert: HighCostRate
        expr: sum(rate(api_cost_cents_total[1h])) > 500
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Estimated cost > $5/hour"
          description: "Aggregate estimated cost exceeds $5 per hour."
