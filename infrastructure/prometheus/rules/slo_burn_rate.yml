groups:
  - name: slo-burn-rate
    interval: 30s
    rules:
      # Error ratio recordings over different windows
      - record: job:api_error_ratio:5m
        expr: |
          sum by (route, method) (increase(api_requests_total{status_class=~"5xx|4xx"}[5m]))
          /
          clamp_min(sum by (route, method) (increase(api_requests_total[5m])), 1)

      - record: job:api_error_ratio:1h
        expr: |
          sum by (route, method) (increase(api_requests_total{status_class=~"5xx|4xx"}[1h]))
          /
          clamp_min(sum by (route, method) (increase(api_requests_total[1h])), 1)

      # Fast-burn (5m/1h) and slow-burn (1h/6h) alerts
      - alert: APIErrorBudgetBurnFast
        expr: |
          (job:api_error_ratio:5m) > 0.02 and (job:api_error_ratio:1h) > 0.01
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Fast burn-rate on API errors"
          description: "Error ratio over 5m and 1h windows is high."

      - alert: APIHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le, route, method) (rate(api_request_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "High P95 latency (>5s)"
          description: "P95 latency exceeds 5 seconds for 10 minutes."

      # Simple error-rate alert (global 1% over 5m)
      - alert: APIErrorRateHigh
        expr: |
          sum(rate(api_requests_total{status_class=~"4xx|5xx"}[5m]))
          /
          clamp_min(sum(rate(api_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "API error rate > 1%"
          description: "Aggregate error rate exceeds 1% over 5 minutes."
