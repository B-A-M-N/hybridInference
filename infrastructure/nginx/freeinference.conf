# Upstream to the local app server
upstream hybrid_backend {
    # The application listens only on localhost:8080
    server 127.0.0.1:8080;
    keepalive 64;
}

# Map for WebSocket upgrade handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name freeinference.org www.freeinference.org;

    # Security headers (HTTP version)
    server_tokens off;

    # Logs (adjust paths to your preference)
    access_log /var/log/nginx/freeinference.access.log;
    error_log  /var/log/nginx/freeinference.error.log warn;

    # Reasonable request limits
    client_max_body_size 25m;

    # Proxy defaults suitable for streaming and long-running requests
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    # Gzip JSON but avoid compressing event-stream
    gzip on;
    gzip_types application/json text/plain;
    gzip_vary on;

    # OpenAI/OpenRouter-compatible API prefix
    location /v1/ {
        proxy_pass http://hybrid_backend;

        # Streaming-friendly settings
        proxy_buffering off;          # do not buffer upstream responses
        proxy_request_buffering off;  # stream request to upstream
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # Future-proof for WebSocket pass-through
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Health check passthrough (optional)
    # Map /healthz to the app's /health endpoint to avoid 404s.
    location = /healthz {
        proxy_pass http://hybrid_backend/health;
        proxy_buffering off;
    }

    # Everything else is not served here
    location / {
        return 404;
    }
}
