# Synced from live Grafana DB (2026-03-12).
# UIDs must match the existing grafana.db so dashboards continue working.
apiVersion: 1
datasources:
  - name: prometheus
    uid: fexk65coxgoaof
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: freeinference Postgres
    uid: af043ano31dz4f
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    editable: false
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
    secureJsonData:
      user: ${DB_USER}
      password: ${DB_PASSWORD}
