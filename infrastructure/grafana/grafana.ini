# Grafana configuration
# Synced from /etc/grafana/grafana.ini on the host (2026-03-12).
# Only non-default settings are listed here.
#
# In Docker, these are set via environment variables in docker-compose.yml:
#   GF_SERVER_ROOT_URL, GF_SERVER_SERVE_FROM_SUB_PATH

[server]
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true
